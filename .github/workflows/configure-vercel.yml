name: Configure Vercel & deploy

# One-shot configurator, triggered manually: writes whichever settings are provided
# as inputs into the Vercel project, then builds and deploys so they take effect.
# NOTE: turning OFF Vercel Authentication (Settings → Deployment Protection) is left
# as a deliberate manual step in the dashboard — that toggle removes a security layer,
# so a human flips it.

on:
  workflow_dispatch:
    inputs:
      sonar_password:
        description: 'Team password to set (leave empty to keep current; setting it logs everyone out)'
        required: false
        type: string
      affinity_api_key:
        description: 'Affinity API key (leave empty to keep current)'
        required: false
        type: string
      harmonic_api_key:
        description: 'Harmonic API key (leave empty to keep current)'
        required: false
        type: string

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'highland-europe' }}
    steps:
      - name: Mask inputs in logs
        run: |
          [ -n "${{ inputs.sonar_password }}" ] && echo "::add-mask::${{ inputs.sonar_password }}" || true
          [ -n "${{ inputs.affinity_api_key }}" ] && echo "::add-mask::${{ inputs.affinity_api_key }}" || true
          [ -n "${{ inputs.harmonic_api_key }}" ] && echo "::add-mask::${{ inputs.harmonic_api_key }}" || true

      - uses: actions/checkout@v4

      - name: Write provided settings to Vercel project env
        env:
          IN_PW: ${{ inputs.sonar_password }}
          IN_AFF: ${{ inputs.affinity_api_key }}
          IN_HAR: ${{ inputs.harmonic_api_key }}
        run: |
          set -euo pipefail
          TEAM_ID=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams/$VERCEL_SCOPE" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          BODY=$(python3 -c "
          import json, os, secrets
          envs = []
          def add(k, v): envs.append({'key': k, 'value': v, 'type': 'encrypted', 'target': ['production', 'preview']})
          if os.environ.get('IN_PW'):
              add('SONAR_PASSWORD', os.environ['IN_PW']); add('SESSION_SECRET', secrets.token_hex(32))
          if os.environ.get('IN_AFF'):
              add('AFFINITY_API_KEY', os.environ['IN_AFF'])
          if os.environ.get('IN_HAR'):
              add('HARMONIC_API_KEY', os.environ['IN_HAR'])
          print(json.dumps(envs))
          ")
          if [ "$BODY" = "[]" ]; then echo "no settings provided — skipping env write"; else
            curl -sf -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "content-type: application/json" \
              "https://api.vercel.com/v10/projects/sonar/env?teamId=$TEAM_ID&upsert=true" \
              -d "$BODY" > /dev/null
            echo "env vars written: $(echo "$BODY" | python3 -c 'import sys,json;print(",".join(e["key"] for e in json.load(sys.stdin)))')"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Sonar
        run: python3 scripts/build_coverage.py

      - name: Stage build output
        run: cp viz/index.html deploy/public/index.html

      - name: Deploy to Vercel
        working-directory: deploy
        run: |
          npm i -g vercel@latest
          vercel link --yes --project sonar --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
