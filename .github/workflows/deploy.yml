name: Build & deploy Sonar

on:
  push:
    branches: [main, claude/highland-vc-connectivity-viz-9cykqj]
  schedule:
    - cron: '30 5 * * *'   # nightly rebuild, 05:30 UTC
  workflow_dispatch:

concurrency:
  group: sonar-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'highland-europe' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Sonar
        run: python3 scripts/build_coverage.py

      - name: Stage build output
        run: cp viz/index.html deploy/public/index.html

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: deploy
        run: |
          npm i -g vercel@latest
          SCOPE=()
          [ -n "$VERCEL_SCOPE" ] && SCOPE=(--scope "$VERCEL_SCOPE")
          vercel link --yes --project sonar --token "$VERCEL_TOKEN" "${SCOPE[@]}"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" "${SCOPE[@]}"

      - name: Note when the Vercel token is missing
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN secret not set — built successfully but skipped deploy. Add the secret (see deploy/README.md) to enable deploys."
